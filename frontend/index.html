<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Career Navigator — AI-powered career guidance platform. Login or create an account to get started." />
  <title>Career Navigator — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Logo -->
    <div class="logo">
      <h1>🧭 Career Navigator</h1>
      <p>AI-Powered Career Guidance</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button id="tab-login" class="active">Sign In</button>
      <button id="tab-signup">Create Account</button>
    </div>

    <!-- Error -->
    <div id="auth-error" class="auth-error hidden"></div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter your username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <!-- Signup Form (stacked vertically) -->
    <form id="signup-form" class="auth-form hidden">
      <div class="form-group">
        <label for="signup-firstname">First Name</label>
        <input type="text" id="signup-firstname" placeholder="John" required />
      </div>
      <div class="form-group">
        <label for="signup-lastname">Last Name</label>
        <input type="text" id="signup-lastname" placeholder="Doe" required />
      </div>
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" placeholder="Choose a username" required />
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Create a password" required />
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
  </div>

  <script src="js/env.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
